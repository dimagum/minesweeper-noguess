name: Release

# Сборка десктоп-версий по тегу v* (например, `git tag v0.1.0 && git push origin v0.1.0`).
# Результат — черновик релиза на GitHub с .dmg / .msi / .exe / .AppImage / .deb.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.args }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      # src-tauri лежит в корне, Tauri CLI — в web/node_modules.
      # beforeBuildCommand (сборка WASM и веб-части) Tauri сам запускает в web/.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm --prefix web exec -- tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: No-Guess Minesweeper ${{ github.ref_name }}
          releaseBody: |
            Desktop builds of No-Guess Minesweeper.
            The apps are not code-signed: on macOS open the app with right-click → Open the first time; on Windows choose "More info → Run anyway".
          releaseDraft: true
          uploadWorkflowArtifacts: true
