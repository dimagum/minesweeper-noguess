<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Minesweeper where every board is solvable by pure logic — no 50/50 guesses." />
    <meta name="theme-color" content="#F1EADF" />
    <title>No-Guess Minesweeper</title>
  </head>
  <body>
    <main id="menu" class="screen">
      <svg class="logo" viewBox="0 0 140 140" aria-hidden="true">
        <circle cx="70" cy="70" r="46" fill="var(--fg)" />
        <circle cx="70" cy="70" r="41" fill="var(--bg)" />
        <circle cx="70" cy="70" r="16" fill="var(--fg)" />
      </svg>
      <h1 class="title">No-Guess Minesweeper</h1>

      <div class="difficulty">
        <button class="nav" id="diff-prev" aria-label="Previous difficulty">&lt;</button>
        <div class="diff-text">
          <div id="diff-name" class="diff-name">Beginner</div>
          <div id="diff-info" class="diff-info">9 × 9 · 10 mines</div>
        </div>
        <button class="nav" id="diff-next" aria-label="Next difficulty">&gt;</button>
      </div>

      <div id="custom" class="custom" hidden>
        <div class="custom-fields">
          <label>Width <input id="custom-w" type="number" min="5" max="60" inputmode="numeric" /></label>
          <label>Height <input id="custom-h" type="number" min="5" max="40" inputmode="numeric" /></label>
          <label>Mines <input id="custom-m" type="number" min="1" inputmode="numeric" /></label>
        </div>
        <div id="custom-info" class="custom-info"></div>
      </div>

      <div class="caption">THEME</div>
      <div id="swatches" class="swatches" role="radiogroup" aria-label="Theme"></div>

      <div class="caption">CONTROLS</div>
      <div id="controls" class="segmented" role="radiogroup" aria-label="Controls">
        <button role="radio" data-controls="classic">Classic</button>
        <button role="radio" data-controls="touchpad">Touchpad</button>
      </div>
      <div id="controls-info" class="controls-info"></div>

      <div class="menu-buttons">
        <button id="btn-new" class="pill">New Game</button>
        <button id="btn-daily" class="pill daily">
          Daily · <span id="daily-date"></span>
          <span id="daily-status" class="daily-status"></span>
        </button>
        <button id="btn-resume" class="pill" disabled>Resume</button>
      </div>
      <div id="best" class="best"></div>
      <button id="btn-stats" class="link">Statistics</button>
    </main>

    <main id="stats" class="screen" hidden>
      <h2 class="stats-title">Statistics</h2>
      <div class="stats-wrap">
        <table class="stats-table">
          <thead>
            <tr>
              <th scope="col"></th>
              <th scope="col">Played</th>
              <th scope="col">Won</th>
              <th scope="col">Best</th>
              <th scope="col">Avg</th>
              <th scope="col" title="Current / best win streak">Streak</th>
            </tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>
      <div id="stats-daily" class="stats-note"></div>
      <div class="stats-note">Best and average times count only wins without hints.</div>
      <div class="ov-buttons stats-buttons">
        <button id="stats-back" class="pill small">Back</button>
        <button id="stats-reset" class="pill small">Reset</button>
      </div>
    </main>

    <main id="game" class="screen" hidden>
      <div class="game-wrap">
        <header id="hud" class="hud">
          <button id="btn-back" class="icon" title="Menu (Esc)" aria-label="Back to menu">←</button>
          <span id="hud-mines" class="hud-label">⚑ 10</span>
          <span id="hud-title" class="hud-title"></span>
          <span class="spacer"></span>
          <button id="btn-hint" class="icon" title="Hint (H)" aria-label="Hint">?</button>
          <button id="btn-restart" class="icon" title="New game (R)" aria-label="New game">↻</button>
          <span class="spacer"></span>
          <span id="hud-time" class="hud-label hud-time">0</span>
        </header>
        <div id="board-scroll" class="board-scroll">
          <canvas id="board"></canvas>
          <div id="overlay" class="overlay" hidden>
            <div class="card">
              <div id="ov-title" class="ov-title"></div>
              <div id="ov-text" class="ov-text"></div>
              <div class="ov-buttons">
                <button id="ov-retry" class="pill small">Retry board</button>
                <button id="ov-new" class="pill small">New game</button>
                <button id="ov-menu" class="pill small">Menu</button>
              </div>
            </div>
          </div>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
